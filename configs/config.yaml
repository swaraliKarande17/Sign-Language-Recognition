data:
  # Path is ignored by dataset.py — paths are resolved from Kaggle input directly
  dataset_path: "data/phoenix2014T"
  img_size: 224        # unused (kept for API compatibility)
  max_frames: 300      # max frames to use per sample
  batch_size: 4        # reduce to 2 if out of memory on Kaggle
  num_workers: 2       # parallel threads for data loading

# ─── Model settings ─────────────────────────────────────────────────
model:
  backbone: "i3d"        # pre-extracted i3d features (1024-dim), no CNN needed
  hidden_size: 512       # BiLSTM hidden dimension
  num_layers: 2          # number of stacked BiLSTM layers
  dropout: 0.3           # dropout probability
  freeze_backbone: false # no backbone to freeze with i3d features

# ─── Training settings ──────────────────────────────────────────────
training:
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0001
  scheduler: "cosine"
  unfreeze_epoch: 999  # effectively disabled — no CNN backbone
  clip_grad_norm: 5.0
  save_every: 5

# ─── Translation model ──────────────────────────────────────────────
translation:
  model: "Helsinki-NLP/opus-mt-de-en"
  max_length: 128

# ─── Weights & Biases experiment tracking ───────────────────────────
wandb:
  project: "cslr-phoenix"
  entity: "swaralikarande2005"