data:
  # Path is ignored by dataset.py — paths are resolved from Kaggle input directly
  dataset_path: "data/phoenix2014T"
  img_size: 224        # unused (kept for API compatibility)
  max_frames: 300      # max frames to use per sample
  batch_size: 4        # reduce to 2 if out of memory on Kaggle
  num_workers: 2       # parallel threads for data loading

# ─── Model settings ─────────────────────────────────────────────────
model:
  backbone: "i3d"
  hidden_size: 1024      # was 512 — bigger = better
  num_layers: 3          # was 2
  dropout: 0.3
  freeze_backbone: false

# ─── Training settings ──────────────────────────────────────────────
training:
  epochs: 100            # was 50
  learning_rate: 0.0001  # slightly higher for char-level
  weight_decay: 0.0001
  scheduler: "cosine"
  unfreeze_epoch: 999
  clip_grad_norm: 5.0
  save_every: 5

# ─── Translation model ──────────────────────────────────────────────
translation:
  model: "Helsinki-NLP/opus-mt-de-en"
  max_length: 128

# ─── Weights & Biases experiment tracking ───────────────────────────
wandb:
  project: "cslr-phoenix"
  entity: "swaralikarande2005"